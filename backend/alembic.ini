# Alembic configuration for EventLens backend.

[alembic]
# path to migration scripts
script_location = alembic

# SQLAlchemy URL — overridden at runtime from app.core.config.Settings
# This value is only used as a fallback if env.py fails to load settings.
sqlalchemy.url = postgresql://postgres:password123@localhost:5432/eventlens

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
